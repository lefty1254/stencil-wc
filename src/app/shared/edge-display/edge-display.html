<div class="panel">
    @if(overlayUrl()) {
    <div class="controls">
        <label class="control">
            Color {{initialColor()}}
            <input type="color" [(ngModel)]="initialColor" />
        </label>
        <label class="control">
            Alpha {{alpha()}}
            <input type="range" min="0" max="255" [(ngModel)]="alpha" />
        </label>
    </div>
    }

    <div class="stage" [class.clickable]="!!overlayUrl()">
        @if(baseUrl()) {
        <img class="base" [src]="baseUrl()!" [alt]="alt()" />
        }
        @if(overlayUrl()) {
        <img class="overlay" [src]="overlayUrl()!" alt="" />
        }
    </div>
</div>
