<p>sobel works!</p>
@if(img.size()) {
<mat-card class="card">
    <mat-card-header><mat-card-title>Sobel</mat-card-title></mat-card-header>

    <mat-card-content>
        <div class="controls">
            <div class="control">
                <label class="label" matTooltip="Kernel size (odd): 1,3,5,7">
                    ksize
                </label>
                <mat-select [(ngModel)]="ksize">
                    <mat-option *ngFor="let k of ksizes" [value]="k">{{ k }}</mat-option>
                </mat-select>
            </div>

            <div class="control">
                <label class="label" matTooltip="Scale factor applied to the computed derivative">
                    scale
                </label>
                <mat-slider class="w-100" min="0" max="5" step="0.1">
                    <input matSliderThumb [(value)]="scale">
                </mat-slider>
                <mat-form-field appearance="outline" class="num">
                    <input matInput type="number" min="0" max="5" step="0.1" [ngModel]="scale()"
                        (ngModelChange)="scale.set($event)">
                </mat-form-field>
            </div>

            <div class="control">
                <label class="label" matTooltip="Delta added to the result">
                    delta
                </label>
                <mat-slider class="w-100" min="0" max="50" step="1">
                    <input matSliderThumb [(value)]="delta">
                </mat-slider>
                <mat-form-field appearance="outline" class="num">
                    <input matInput type="number" min="0" max="50" step="1" [ngModel]="delta()"
                        (ngModelChange)="delta.set($event)">
                </mat-form-field>
            </div>

            <div class="control">
                <label class="label" matTooltip="Post-processing dilation to thicken edges (integer pixels)">
                    Thickness
                </label>
                <mat-slider class="w-100" min="1" max="15" step="1" [discrete]="true">
                    <input matSliderThumb [(value)]="thickness">
                </mat-slider>
                <mat-form-field appearance="outline" class="num">
                    <input matInput type="number" min="1" max="15" step="1" [ngModel]="thickness()"
                        (ngModelChange)="thickness.set($event)">
                </mat-form-field>
            </div>

            <div class="control">
                <label class="label" matTooltip="Choose overlay base">
                    Base
                </label>
                <mat-select [ngModel]="base()" (ngModelChange)="base.set($event)">
                    <mat-option value="none">None (mask only)</mat-option>
                    <mat-option value="original">Original</mat-option>
                    <mat-option value="gray">Gray</mat-option>
                </mat-select>
            </div>
        </div>

        <edge-display [baseImage]="baseImage()" [mask]="mask()" alt="Sobel Overlay">
        </edge-display>
    </mat-card-content>
</mat-card>
}
