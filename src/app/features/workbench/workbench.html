<mat-toolbar >
    Stencil Workbench
    <div class="uploader">
        <button mat-stroked-button (click)="fileInput.click()">
            <mat-icon>upload</mat-icon>
            Upload Image
        </button>
        <input hidden #fileInput type="file" accept="image/*" (change)="onFile($event)" />
        <button mat-stroked-button (click)="img.clear()">Clear</button>
        <mat-slide-toggle [(ngModel)]="themeToggle">{{themeToggle() ? "Dark Mode" : "Light Mode"}}</mat-slide-toggle>
    </div>
</mat-toolbar>

<section class="container">


    @if(img.size()!== null) {
    <div class="dashboard-grid">
        <mat-card>
            <mat-card-header><mat-card-title>Original</mat-card-title></mat-card-header>
            <mat-card-content>
                <edge-display [baseImage]="img.src()" [mask]="null" alt="Original"></edge-display>
            </mat-card-content>
        </mat-card>

        <mat-card>
            <mat-card-header><mat-card-title>Grayscale</mat-card-title></mat-card-header>
            <mat-card-content>
                <edge-display [baseImage]="img.grayRes.hasValue() ? img.grayRes.value() : null" [mask]="null" 
                    alt="Grayscale"></edge-display>
            </mat-card-content>
        </mat-card>
        <algo-canny />
        <algo-sobel />
    </div>
    }
</section>
